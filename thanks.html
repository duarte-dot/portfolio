<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/assets/css/thanks.css" />
    <title>thanks</title>
  </head>
  <body>
    <div class="page__thanks">
      <h1 class="thanks__title" translation="thank-you">thank you</h1>
      <p
        style="margin-top: 5px; margin-bottom: 30px"
        translation="thank-you-subtitle"
      >
        i will be in touch
      </p>
      <a href="https://duarte-dot.com.br/" translation="go-back">go back</a>
      <!-- language switch: both options stay visible so the active one is never ambiguous -->
      <div
        class="lang-switch"
        id="lang-switch"
        role="group"
        aria-label="Idioma / Language"
        data-active="en"
      >
        <span class="lang-switch__thumb" aria-hidden="true"></span>
        <button
          type="button"
          class="lang-switch__option"
          data-lang="pt"
          aria-pressed="false"
          title="Português (BR)"
        >
          PT
        </button>
        <button
          type="button"
          class="lang-switch__option"
          data-lang="en"
          aria-pressed="true"
          title="English"
        >
          EN
        </button>
      </div>
    </div>

    <script>
      var translations = {
        "thank-you": { en: "thank you", pt: "obrigado" },
        "thank-you-subtitle": {
          en: "i will be in touch",
          pt: "entrarei em contato",
        },
        "go-back": { en: "go back", pt: "voltar" },
      };

      var langSwitch = document.getElementById("lang-switch");
      var langOptions = langSwitch.querySelectorAll(".lang-switch__option");

      function applyLanguage(lang) {
        document.querySelectorAll("[translation]").forEach(function (element) {
          var entry = translations[element.getAttribute("translation")];
          if (entry && entry[lang] !== undefined) element.textContent = entry[lang];
        });

        /* drives the sliding highlight, and doubles as the a11y state so the
           visual and announced states cannot drift apart */
        langSwitch.setAttribute("data-active", lang);
        langOptions.forEach(function (option) {
          var active = option.getAttribute("data-lang") === lang;
          option.setAttribute("aria-pressed", active ? "true" : "false");
        });

        document.documentElement.lang = lang === "pt" ? "pt-br" : "en";
      }

      /* same storage key the main site uses, so the choice carries over here */
      var currentLanguage =
        localStorage.getItem("language") === "pt" ? "pt" : "en";

      langSwitch.addEventListener("click", function (event) {
        var option = event.target.closest(".lang-switch__option");
        if (!option) return;

        var chosen = option.getAttribute("data-lang");
        if (!chosen || chosen === currentLanguage) return;

        currentLanguage = chosen;
        applyLanguage(currentLanguage);
        localStorage.setItem("language", currentLanguage);
      });

      applyLanguage(currentLanguage);
    </script>
  </body>
</html>
